{% extends 'base.html' %}{% block content %}<div class="auth-shell"><div class="auth-card"><div class="text-center mb-4"><div class="auth-icon"><i class="bi bi-person-lock"></i></div><h2>Welcome back</h2><p class="text-muted">Sign in to your TalentIQ workspace</p></div><form method="post">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<div class="mb-3"><label class="form-label">Username</label><input class="form-control form-control-lg" name="username" autofocus required></div><div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control form-control-lg" name="password" required></div><button class="btn btn-primary w-100 btn-lg">Sign in</button></form><p class="text-center mt-4 small">Candidate? <a href="{% url 'register_candidate' %}">Create an account</a></p></div></div>{% endblock %}
