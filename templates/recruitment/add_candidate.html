{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="form-card mx-auto" style="max-width:800px"><span class="eyebrow">Recruiter action</span><h2>Add a candidate</h2><p class="text-muted">Create a basic candidate account and optionally attach a PDF resume.</p><form method="post" enctype="multipart/form-data" class="row g-3">{% csrf_token %}{% for f in form %}<div class="col-md-{% if f.name == 'first_name' or f.name == 'last_name' %}6{% else %}12{% endif %}"><label class="form-label">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}<div><button class="btn btn-primary">Add candidate</button></div></form></div></div>{% endblock %}
