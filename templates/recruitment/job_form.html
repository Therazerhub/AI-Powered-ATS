{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="form-card"><span class="eyebrow">Vacancy management</span><h2>{% if job %}Edit {{ job.title }}{% else %}Create a job vacancy{% endif %}</h2><form method="post" class="row g-3 mt-2">{% csrf_token %}{% for field in form %}<div class="{% if field.name == 'description' or 'skill' in field.name %}col-12{% else %}col-md-6{% endif %}"><label class="form-label">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<small class="text-danger">{{ e }}</small>{% endfor %}</div>{% endfor %}<div class="col-12"><button class="btn btn-primary">Save vacancy</button><a href="{% url 'recruiter_dashboard' %}" class="btn btn-light">Cancel</a></div></form></div></div>{% endblock %}
