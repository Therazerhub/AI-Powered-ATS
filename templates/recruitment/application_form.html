{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="form-card mx-auto" style="max-width:780px"><span class="eyebrow">Application</span><h2>Apply for {{ job.title }}</h2><p class="text-muted">{{ job.department }} · {{ job.location }}</p><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn btn-primary">Submit application</button></form></div></div>{% endblock %}
